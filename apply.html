<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Now | Newschool Africa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .form-step {
            display: none;
        }

        .form-step.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 0.75rem;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--color-white);
            font-family: var(--font-body);
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--color-cyan);
        }

        .step-indicators {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
        }

        .step-dot.active {
            background: var(--color-cyan);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html">
                <img src="assets/images/loggo.png" alt="Newschool Africa" class="logo">
            </a>
        </div>
    </nav>

    <header class="section text-center" style="padding-top: 120px;">
        <div class="container">
            <h1 class="hero-title">Join the <span class="text-gradient">Revolution</span></h1>
            <p class="hero-subtitle">Start your application today.</p>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <div class="step-indicators">
                    <div class="step-dot active" id="dot-1"></div>
                    <div class="step-dot" id="dot-2"></div>
                    <div class="step-dot" id="dot-3"></div>
                </div>

                <form id="application-form" name="application" method="POST" data-netlify="true">
                    <!-- Step 1: Personal Info -->
                    <div class="form-step active" id="step-1">
                        <h3 class="text-center">Personal Information</h3>
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-input" id="email-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" name="phone" class="form-input" required>
                        </div>
                        <div class="text-center">
                            <button type="button" class="btn btn-primary" onclick="nextStep(2)">Next Step</button>
                        </div>
                    </div>

                    <!-- Step 2: Course Selection -->
                    <div class="form-step" id="step-2">
                        <h3 class="text-center">Choose Your Path</h3>
                        <div class="form-group">
                            <label class="form-label">Select Course</label>
                            <select name="course" class="form-select" required>
                                <option value="no-code">No-Code Development</option>
                                <option value="ai">AI Tools & Automation</option>
                                <option value="design">Product Design (UI/UX)</option>
                                <option value="security">Cybersecurity</option>
                                <option value="web">Web Development</option>
                                <option value="pm">Product Management</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Preferred Cohort</label>
                            <select name="cohort" class="form-select" required>
                                <option value="aug-2025">August 2025</option>
                                <option value="oct-2025">October 2025</option>
                            </select>
                        </div>
                        <div class="text-center" style="display: flex; gap: 1rem; justify-content: center;">
                            <button type="button" class="btn btn-secondary" onclick="prevStep(1)">Back</button>
                            <button type="button" class="btn btn-primary" onclick="nextStep(3)">Next Step</button>
                        </div>
                    </div>

                    <!-- Step 3: Payment -->
                    <div class="form-step" id="step-3">
                        <h3 class="text-center">Secure Your Seat</h3>
                        <p class="text-center" style="margin-bottom: 1.5rem; color: var(--color-grey-muted);">
                            Application Fee: <span class="text-cyan" style="font-weight: 700;">₦5,000</span>
                        </p>
                        <div class="text-center"
                            style="display: flex; gap: 1rem; justify-content: center; flex-direction: column;">
                            <button type="button" class="btn btn-primary" onclick="payWithPaystack()">Pay Now</button>
                            <button type="button" class="btn btn-secondary" onclick="prevStep(2)">Back</button>
                        </div>
                        <p class="text-center"
                            style="margin-top: 1rem; font-size: 0.8rem; color: var(--color-grey-muted);">
                            Secured by Paystack
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container footer-bottom text-center">
            <p>&copy; 2025 Newschool Africa. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script>
        let currentStep = 1;

        function showStep(step) {
            document.querySelectorAll('.form-step').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.step-dot').forEach(el => el.classList.remove('active'));

            document.getElementById(`step-${step}`).classList.add('active');
            document.getElementById(`dot-${step}`).classList.add('active');
            currentStep = step;
        }

        function nextStep(step) {
            // Add validation logic here if needed
            showStep(step);
        }

        function prevStep(step) {
            showStep(step);
        }

        function payWithPaystack() {
            const email = document.getElementById('email-input').value;
            if (!email) {
                alert('Please enter your email address in Step 1');
                showStep(1);
                return;
            }

            const handler = PaystackPop.setup({
                key: 'pk_test_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx', // REPLACE WITH YOUR PUBLIC KEY
                email: email,
                amount: 500000, // Amount in kobo (5000 * 100)
                currency: 'NGN',
                ref: '' + Math.floor((Math.random() * 1000000000) + 1),
                callback: function (response) {
                    // Payment complete!
                    // Submit the form or redirect
                    // document.getElementById('application-form').submit(); // If using Netlify Forms
                    window.location.href = 'apply-success.html?reference=' + response.reference;
                },
                onClose: function () {
                    alert('Transaction was not completed, window closed.');
                }
            });
            handler.openIframe();
        }
    </script>
    <script src="scripts/main.js"></script>
</body>

</html>
